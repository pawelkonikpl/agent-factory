# Dev container for coding on the demo app (devcontainer.json). Development only:
# Keycloak in dev mode, in-memory database, demo passwords.
#
# dev joins keycloak's network namespace, like the sandbox (../compose.yaml), so
# localhost:8080 is Keycloak inside the container, just as it is for the browser.
# postgres joins the same namespace, so localhost:5432 is PostgreSQL (no persistent
# data); dev starts once it is healthy.
# Nothing is published: the Dev Containers client forwards 5173 and 8080 to the host.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ../keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro

  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_DB: emailsender
      POSTGRES_USER: emailsender
      POSTGRES_PASSWORD: emailsender
    network_mode: "service:keycloak"
    depends_on: [keycloak]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "emailsender", "-d", "emailsender"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dev:
    # The context is this folder only, so no .env file can end up in the image.
    build:
      context: .
      dockerfile: Containerfile
    network_mode: "service:keycloak"
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    command: sleep infinity
    volumes:
      - ..:/workspace
