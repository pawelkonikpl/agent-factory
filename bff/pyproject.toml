[project]
name = "demo-bff"
version = "0.1.0"
description = "Backend for Frontend: OAuth confidential client that keeps tokens away from the browser"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
