# Full-stack sandbox for local development only: Keycloak in dev mode, in-memory database,
# demo passwords and secrets (the .env.example values).
#
# api, bff and web join keycloak's network namespace, so every service reaches the others
# on localhost, just like the browser does, and the issuer and redirect URI stay valid.
# keycloak therefore publishes all the ports; the BFF (8000) and the API (8001) stay internal.
# postgres joins the same namespace, so the API reaches PostgreSQL on localhost:5432, which
# is not published either. It keeps no data. api starts only once postgres is healthy.
# smtp4dev (dev SMTP server, no persistent mail) joins it too: the API reaches SMTP on
# localhost:2525, which is not published; keycloak publishes its inbox on 5080.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:5080:5080"
    volumes:
      - ./keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro

  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_DB: emailsender
      POSTGRES_USER: emailsender
      POSTGRES_PASSWORD: emailsender
    network_mode: "service:keycloak"
    depends_on: [keycloak]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "emailsender", "-d", "emailsender"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smtp4dev:
    image: docker.io/rnwood/smtp4dev:3.15.0
    environment:
      ServerOptions__Port: "2525"
      ServerOptions__Urls: "http://*:5080"
    network_mode: "service:keycloak"
    depends_on: [keycloak]

  api:
    build:
      context: ./api
      dockerfile: Containerfile
    env_file: ./api/.env.example
    network_mode: "service:keycloak"
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy

  bff:
    build:
      context: ./bff
      dockerfile: Containerfile
    env_file: ./bff/.env.example
    network_mode: "service:keycloak"
    depends_on: [keycloak]

  web:
    build:
      context: ./web
      dockerfile: Containerfile
    network_mode: "service:keycloak"
    depends_on: [keycloak]
