# Keycloak, PostgreSQL and smtp4dev for local development only: Keycloak in dev mode, demo
# passwords, no persistent data (all lose everything when their container is removed).
# smtp4dev is a dev SMTP server: SMTP on 127.0.0.1:2525, inbox at http://localhost:5080.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro

  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_DB: emailsender
      POSTGRES_USER: emailsender
      POSTGRES_PASSWORD: emailsender
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "emailsender", "-d", "emailsender"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smtp4dev:
    image: docker.io/rnwood/smtp4dev:3.15.0
    environment:
      ServerOptions__Port: "2525"
      ServerOptions__Urls: "http://*:5080"
    ports:
      - "127.0.0.1:2525:2525"
      - "127.0.0.1:5080:5080"
